  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Notizblatt -->
  <rect x="120" y="96" width="272" height="320" rx="40" fill="#ffffff" fill-opacity="0.18"/>
  <!-- Listenzeilen -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="22" stroke-linecap="round">
    <line x1="280" y1="190" x2="352" y2="190"/>
    <line x1="280" y1="256" x2="352" y2="256"/>
    <line x1="280" y1="322" x2="352" y2="322"/>
  </g>
  <!-- Aufzählungspunkte -->
  <circle cx="190" cy="256" r="16" fill="#fff" fill-opacity="0.85"/>
  <circle cx="190" cy="322" r="16" fill="#fff" fill-opacity="0.85"/>
  <!-- grosser Haken, der aus dem Blatt ragt -->
  <path d="M146 196 L192 244 L318 96" fill="none" stroke="url(#chk)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Funken -->
  <path d="M388 120 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z" fill="#fde68a"/>
