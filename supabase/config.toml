# Konfiguration für die Supabase-CLI (Deployment der Edge Functions)
project_id = "pendenzen"

[functions.calendar]
# Kalender-Apps können keinen Login mitschicken; der Zugriff läuft über den geheimen Token in der URL
verify_jwt = false

[functions.send-reminders]
# Aufruf durch pg_cron; abgesichert über den geheimen Header x-cron-secret
verify_jwt = false

[functions.scan-document]
# Das Login-Token prüft die Funktion selbst (CORS-Vorabanfragen des Browsers tragen keines)
verify_jwt = false
