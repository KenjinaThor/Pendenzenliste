name: Edge Functions deployen
# Veröffentlicht die Supabase Edge Functions (z. B. den Kalender-Feed), wenn sich der Code ändert.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Funktionen veröffentlichen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt (siehe README, Abschnitt Kalender)"
            exit 1
          fi
          # Projekt-ID aus der Supabase-URL ableiten: https://<ID>.supabase.co
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          for fn in calendar send-reminders; do
            supabase functions deploy "$fn" --project-ref "$REF" --no-verify-jwt --use-api
          done
